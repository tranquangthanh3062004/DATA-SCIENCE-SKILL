# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ADI-OS — Model Deployment Pipeline                                    ║
# ║  Enforces Gate 3, 6, 7 before production deployment                   ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: CD — Model Deployment

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model name to deploy"
        required: true
        type: string
      model_version:
        description: "Model version (semantic)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  # ── Gate 3: Model Science Review ──
  gate-3-model-review:
    name: "🔬 Gate 3 — Model Science Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify MODEL_CARD.md exists
        run: |
          if [ ! -f "models/${{ inputs.model_name }}/MODEL_CARD.md" ]; then
            echo "::error::❌ Gate 3 FAILED — MODEL_CARD.md not found"
            exit 1
          fi
          echo "✅ MODEL_CARD.md present"

      - name: Verify MODEL_EVALUATION.md exists
        run: |
          if [ ! -f "models/${{ inputs.model_name }}/MODEL_EVALUATION.md" ]; then
            echo "::error::❌ Gate 3 FAILED — MODEL_EVALUATION.md not found"
            exit 1
          fi
          echo "✅ MODEL_EVALUATION.md present"

      - name: Verify baseline comparison
        run: |
          if ! grep -q "baseline" "models/${{ inputs.model_name }}/MODEL_EVALUATION.md"; then
            echo "::error::❌ Gate 3 FAILED — No baseline comparison found"
            exit 1
          fi
          echo "✅ Baseline comparison documented"

  # ── Gate 6: Independent Review ──
  gate-6-independent-review:
    name: "👥 Gate 6 — Independent Review Check"
    runs-on: ubuntu-latest
    needs: gate-3-model-review
    steps:
      - uses: actions/checkout@v4

      - name: Verify review sign-off
        run: |
          echo "⚠️  Gate 6 requires human review sign-off"
          echo "Check: models/${{ inputs.model_name }}/REVIEW_SIGNOFF.md"
          if [ ! -f "models/${{ inputs.model_name }}/REVIEW_SIGNOFF.md" ]; then
            echo "::error::❌ Gate 6 FAILED — No independent review sign-off"
            exit 1
          fi
          echo "✅ Independent review documented"

  # ── Deploy to Staging ──
  deploy-staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: gate-6-independent-review
    if: inputs.environment == 'staging' || inputs.environment == 'production'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy model to staging
        run: |
          echo "Deploying ${{ inputs.model_name }}:${{ inputs.model_version }} to staging..."
          # Add actual deployment commands here
          echo "✅ Staging deployment complete"

  # ── Deploy to Production (requires manual approval) ──
  deploy-production:
    name: "🏭 Deploy to Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: inputs.environment == 'production'
    environment: production  # Requires manual approval in GitHub settings
    steps:
      - uses: actions/checkout@v4
      - name: Deploy model to production
        run: |
          echo "Deploying ${{ inputs.model_name }}:${{ inputs.model_version }} to production..."
          # Add actual deployment commands here
          echo "✅ Production deployment complete"

      - name: Log deployment to DECISION_LOG
        run: |
          echo "## Deployment: ${{ inputs.model_name }}:${{ inputs.model_version }}" >> DECISION_LOG.md
          echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> DECISION_LOG.md
          echo "- **Environment:** production" >> DECISION_LOG.md
          echo "- **Gate 3:** PASSED" >> DECISION_LOG.md
          echo "- **Gate 6:** PASSED" >> DECISION_LOG.md
          echo "- **Gate 7:** PASSED" >> DECISION_LOG.md
