# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ADI-OS — Model Deployment Pipeline                                    ║
# ║  Enforces Gate 3, 6, 7 before production deployment                   ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Security: workflow inputs are NEVER interpolated directly into shell scripts
# (`${{ inputs.* }}` inside `run:` enables script injection). They are passed via
# `env:` and validated against a strict allow-list regex first.

name: CD — Model Deployment

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Model name to deploy (lowercase, digits, - or _)"
        required: true
        type: string
      model_version:
        description: "Model version (semantic, e.g. 1.2.0)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  MODEL_NAME: ${{ inputs.model_name }}
  MODEL_VERSION: ${{ inputs.model_version }}

jobs:
  # ── Input validation (blocks script/path injection) ──
  validate-inputs:
    name: "🛡️ Validate inputs"
    runs-on: ubuntu-latest
    steps:
      - name: Validate model name and version
        run: |
          if ! [[ "$MODEL_NAME" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]]; then
            echo "::error::Invalid model_name — allowed: ^[a-z0-9][a-z0-9_-]{0,63}$"
            exit 1
          fi
          if ! [[ "$MODEL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid model_version — expected semantic version X.Y.Z"
            exit 1
          fi
          echo "✅ Inputs valid"

  # ── Gate 3: Model Science Review ──
  gate-3-model-review:
    name: "🔬 Gate 3 — Model Science Validation"
    runs-on: ubuntu-latest
    needs: validate-inputs
    steps:
      - uses: actions/checkout@v4

      - name: Verify required model artifacts
        run: |
          dir="models/${MODEL_NAME}"
          for f in MODEL_CARD.md MODEL_EVALUATION.md; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::❌ Gate 3 FAILED — $dir/$f not found"
              exit 1
            fi
          done
          if ! grep -qi "baseline" "$dir/MODEL_EVALUATION.md"; then
            echo "::error::❌ Gate 3 FAILED — No baseline comparison found"
            exit 1
          fi
          if ! grep -q "Gate 3 Status:\*\* \`PASSED\`" "$dir/MODEL_EVALUATION.md"; then
            echo "::error::❌ Gate 3 FAILED — MODEL_EVALUATION.md does not report Gate 3 PASSED"
            exit 1
          fi
          echo "✅ Gate 3 artifacts present and passing"

  # ── Gate 6: Independent Review ──
  gate-6-independent-review:
    name: "👥 Gate 6 — Independent Review Check"
    runs-on: ubuntu-latest
    needs: gate-3-model-review
    steps:
      - uses: actions/checkout@v4

      - name: Verify review sign-off
        run: |
          f="models/${MODEL_NAME}/REVIEW_SIGNOFF.md"
          if [ ! -f "$f" ]; then
            echo "::error::❌ Gate 6 FAILED — No independent review sign-off ($f)"
            exit 1
          fi
          echo "✅ Independent review documented"

  # ── Deploy to Staging ──
  deploy-staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: gate-6-independent-review
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy model to staging
        run: |
          echo "Deploying ${MODEL_NAME}:${MODEL_VERSION} to staging..."
          echo "::warning::Deployment target not configured yet — no-op (see ROADMAP)."

  # ── Deploy to Production (requires manual approval) ──
  deploy-production:
    name: "🏭 Deploy to Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: inputs.environment == 'production'
    environment: production  # Requires manual approval in GitHub settings
    steps:
      - uses: actions/checkout@v4
      - name: Deploy model to production
        run: |
          echo "Deploying ${MODEL_NAME}:${MODEL_VERSION} to production..."
          echo "::warning::Deployment target not configured yet — no-op (see ROADMAP)."

      - name: Record deployment in job summary
        run: |
          {
            echo "## Deployment: ${MODEL_NAME}:${MODEL_VERSION}"
            echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- **Environment:** production"
            echo "- **Gate 3 / Gate 6:** verified by upstream jobs"
            echo "- **Actor:** ${GITHUB_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
