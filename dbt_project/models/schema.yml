version: 2

models:
  - name: stg_customer_transactions
    description: "Validated transaction records derived from bronze.raw_customer_transactions."
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: transaction_amount
        tests: [not_null]
      - name: transaction_status
        tests:
          - not_null
          - accepted_values:
              values: [completed, refunded, cancelled]
      - name: transaction_date
        tests: [not_null]

  - name: mart_daily_revenue
    description: "Daily gross-revenue aggregate for completed transactions."
    columns:
      - name: transaction_date
        tests: [not_null]
      - name: gross_revenue
        tests: [not_null]
